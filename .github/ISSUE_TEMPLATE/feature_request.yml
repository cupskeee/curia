name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Curia is pre-alpha and run by one maintainer, so requests are weighed against the plan in [`docs/milestones.md`](https://github.com/cupskeee/curia/blob/main/docs/milestones.md). Please read it first; the feature may already be planned or deliberately out of scope.

        **Never paste API keys, tokens or full logs into this form.** Issues are public.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like Curia to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you thought about, and why they fall short.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Mod
        - App UI
        - Providers
        - Personas
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to help with this, for example by implementing it or testing it.
          required: false
