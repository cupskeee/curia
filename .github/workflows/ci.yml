name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner images are pinned (not -latest): windows-2022 is the VS 2022 image our preset needs
# (windows-latest is Visual Studio 2026 only), ubuntu-24.04 is our Linux floor, macos-26 is current.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository hygiene scan (no Paradox content, no keys)
        run: tools/ci/scan_patterns.sh
      - name: Source rules (model IDs, curl debug options, secret access)
        run: tools/ci/check_source_rules.sh
      - name: Version consistency (CMake, vcpkg.json, CHANGELOG)
        run: tools/ci/check_versions.sh
      - name: Mod structure lint (no game files involved)
        run: |
          python3 tools/ci/lint_mod.py
          python3 -m unittest discover -s tools/ci -p "test_*.py"
      - name: M3 log watcher unit tests (synthetic data only)
        run: python3 -m unittest discover -s tools/m3
      - name: Fake CK3 unit tests (synthetic data only)
        run: python3 -m unittest discover -s tools/fake_ck3
      - name: Mock LLM unit tests (synthetic data only)
        run: python3 -m unittest discover -s tools/mock_llm
      - name: M4 tools unit tests (synthetic data only)
        run: python3 -m unittest discover -s tools/m4
      - name: Developer tools (pinned versions)
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet -r tools/requirements-dev.txt
      - name: YAML and JSON syntax
        run: |
          .venv-tools/bin/python - <<'PY'
          import glob, json, sys
          import yaml
          bad = 0
          for path in glob.glob(".github/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}"); bad += 1
          for path in ["CMakePresets.json", "vcpkg.json"]:
              try:
                  json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: clang-format (pinned version)
        run: CLANG_FORMAT=.venv-tools/bin/clang-format tools/ci/check_format.sh

  # Which checks this run needs (CONTRIBUTING.md, "Branches"). A pull request into dev gets the light
  # check: lint and the Linux build with its tests. Pull requests into main (dev -> main) and pushes
  # to main get everything: the four build legs, the universal binary, the sanitizers and clang-tidy,
  # and the fuzz smoke test.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - name: Choose the light check or the full matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          legs='[
            {"name": "windows-x64", "os": "windows-2022", "preset": "windows-x64", "triplet": "curia-x64-windows", "test": true},
            {"name": "macos-arm64", "os": "macos-26", "preset": "macos-arm64", "triplet": "curia-arm64-osx", "test": true},
            {"name": "macos-x64", "os": "macos-26", "preset": "macos-x64", "triplet": "curia-x64-osx", "test": false},
            {"name": "linux-x64", "os": "ubuntu-24.04", "preset": "linux-x64", "triplet": "curia-x64-linux", "test": true}
          ]'
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "dev" ]; then
            full=false
            legs=$(jq -c '[.[] | select(.name == "linux-x64")]' <<<"$legs")
          else
            full=true
            legs=$(jq -c '.' <<<"$legs")
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "full=$full legs=$legs"

  build:
    name: build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system packages for SDL3 (X11, Wayland, EGL, ibus), vcpkg's autotools ports and xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxft-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libibus-1.0-dev xvfb xauth
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key-suffix: ${{ matrix.triplet }}
      - name: Configure
        id: configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DCURIA_WARNINGS_AS_ERRORS=ON -DCURIA_REQUIRE_PYTHON=ON
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}
      # Configure runs vcpkg install, so a successful Configure means every port is in the cache. Saving after a failed
      # Configure would store a partial cache under the exact key, and an exact hit is never saved again.
      - name: Save the vcpkg binary cache (when every port was built, even if a later step failed)
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Test (unit, smoke, idle)
        if: matrix.test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --preset ${{ matrix.preset }}
          else
            ctest --preset ${{ matrix.preset }}
          fi
      - name: Test (network, HTTPS with the shipped libcurl configuration)
        if: matrix.test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}-network --repeat until-pass:3
      - name: Record libcurl's default CA behaviour (informational)
        if: matrix.test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}-netinfo || true
      - name: Upload the macOS binary for the universal build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curia-${{ matrix.name }}
          path: build/${{ matrix.preset }}/app/curia
          retention-days: 3
          if-no-files-found: error

  universal:
    name: macOS universal binary
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: curia-macos-*
          path: parts
      - name: Merge with lipo
        run: |
          lipo -create -output curia-universal parts/curia-macos-arm64/curia parts/curia-macos-x64/curia
          lipo -archs curia-universal
          test "$(lipo -archs curia-universal | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          chmod +x curia-universal
      - name: Run both slices (Rosetta is part of the runner image)
        run: |
          arch -arm64 ./curia-universal --version
          arch -x86_64 ./curia-universal --version
          arch -x86_64 ./curia-universal --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curia-macos-universal-unsigned
          path: curia-universal
          retention-days: 3

  sanitizers:
    name: sanitizers and clang-tidy (core + tests)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key-suffix: curia-x64-linux-core
      - name: Configure (core and tests only, ASan and UBSan)
        id: configure
        run: cmake --preset linux-x64-sanitize -DCURIA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-x64-sanitize
      # Configure runs vcpkg install, so a successful Configure means every port is in the cache. Saving after a failed
      # Configure would store a partial cache under the exact key, and an exact hit is never saved again.
      - name: Save the vcpkg binary cache (when every port was built, even if a later step failed)
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset linux-x64-sanitize
      - name: clang-tidy (core, net, providers, chat view model, Linux platform, tests)
        run: |
          # The macOS-only probe tests (test_probe_*) are not part of this configuration.
          # One clang-tidy per file, one file per core (xargs exits non-zero if any invocation does).
          find app/src/advisor app/src/bridge app/src/chatview app/src/core app/src/net app/src/providers app/src/platform/linux app/tests app/fuzz -name '*.cpp' -not -name 'test_probe_*' -print0 |
            xargs -0 -n1 -P "$(nproc)" clang-tidy-18 -p build/linux-x64-sanitize --quiet

  fuzz-smoke:
    name: fuzz smoke
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key-suffix: curia-x64-linux-core
      - name: Configure (core only, libFuzzer with ASan and UBSan)
        id: configure
        run: cmake --preset linux-x64-fuzz -DCURIA_WARNINGS_AS_ERRORS=ON
      - name: Build the fuzz targets
        run: cmake --build --preset linux-x64-fuzz --target curia_fuzz_bridge curia_fuzz_sse
      # Configure runs vcpkg install, so a successful Configure means every port is in the cache. Saving after a failed
      # Configure would store a partial cache under the exact key, and an exact hit is never saved again.
      - name: Save the vcpkg binary cache (when every port was built, even if a later step failed)
        if: always() && steps.configure.outcome == 'success' && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Fuzz the bridge for 45 seconds from the committed seed corpus
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          # libFuzzer writes new inputs into the first corpus folder: a scratch copy, so the checkout stays clean.
          # -max_len 256 KiB: a frame reaches its 128 KiB cap only with about 33 long records, which a shorter input cannot hold.
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/crashes"
          cp -r app/fuzz/corpus/. "$RUNNER_TEMP/corpus/"
          build/linux-x64-fuzz/app/curia_fuzz_bridge -max_total_time=45 -timeout=10 -rss_limit_mb=2048 -max_len=262144 \
            -artifact_prefix="$RUNNER_TEMP/crashes/" "$RUNNER_TEMP/corpus" tests/fixtures/curia1
      - name: Fuzz the SSE parser for 45 seconds from the committed seed corpus
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p "$RUNNER_TEMP/corpus_sse" "$RUNNER_TEMP/crashes"
          cp -r app/fuzz/corpus_sse/. "$RUNNER_TEMP/corpus_sse/"
          build/linux-x64-fuzz/app/curia_fuzz_sse -max_total_time=45 -timeout=10 -rss_limit_mb=2048 -max_len=262144 \
            -dict=app/fuzz/sse.dict -artifact_prefix="$RUNNER_TEMP/crashes/sse-" "$RUNNER_TEMP/corpus_sse"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: dependency review (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-result:
    name: CI result
    if: always()
    needs: [plan, lint, build, universal, sanitizers, fuzz-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # The light check (a pull request into dev) skips the heavy jobs on purpose; any other run
          # (and a run whose plan failed) needs all of them.
          echo "$NEEDS" | jq -e --arg full "$FULL" '
            def optional: $full == "false" and (.key == "universal" or .key == "sanitizers" or .key == "fuzz-smoke");
            to_entries | map(select(.value.result != "success" and ((optional and .value.result == "skipped") | not)))
            | length == 0' > /dev/null
