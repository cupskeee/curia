name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner images are pinned (not -latest): windows-2022 is the VS 2022 image our preset needs
# (windows-latest is Visual Studio 2026 only), ubuntu-24.04 is our Linux floor, macos-26 is current.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository hygiene scan (no Paradox content, no keys)
        run: tools/ci/scan_patterns.sh
      - name: Version consistency (CMake, vcpkg.json, CHANGELOG)
        run: tools/ci/check_versions.sh
      - name: Mod structure lint (no game files involved)
        run: python3 tools/ci/lint_mod.py
      - name: Developer tools (pinned versions)
        run: |
          python3 -m venv .venv-tools
          .venv-tools/bin/pip install --quiet -r tools/requirements-dev.txt
      - name: YAML and JSON syntax
        run: |
          .venv-tools/bin/python - <<'PY'
          import glob, json, sys
          import yaml
          bad = 0
          for path in glob.glob(".github/**/*.yml", recursive=True):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}"); bad += 1
          for path in ["CMakePresets.json", "vcpkg.json"]:
              try:
                  json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  print(f"{path}: {exc}"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: clang-format (pinned version)
        run: CLANG_FORMAT=.venv-tools/bin/clang-format tools/ci/check_format.sh

  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022, preset: windows-x64, triplet: curia-x64-windows, test: true }
          - { name: macos-arm64, os: macos-26, preset: macos-arm64, triplet: curia-arm64-osx, test: true }
          - { name: macos-x64, os: macos-26, preset: macos-x64, triplet: curia-x64-osx, test: false }
          - { name: linux-x64, os: ubuntu-24.04, preset: linux-x64, triplet: curia-x64-linux, test: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux system packages for SDL3 (X11, Wayland, EGL, ibus), vcpkg's autotools ports and xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxext-dev libxft-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libibus-1.0-dev xvfb xauth
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key-suffix: ${{ matrix.triplet }}
      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} -DCURIA_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Save the vcpkg binary cache (even if a later step failed)
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Test (unit, smoke, idle)
        if: matrix.test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --preset ${{ matrix.preset }}
          else
            ctest --preset ${{ matrix.preset }}
          fi
      - name: Test (network, HTTPS with the shipped libcurl configuration)
        if: matrix.test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}-network --repeat until-pass:3
      - name: Record libcurl's default CA behaviour (informational)
        if: matrix.test
        shell: bash
        run: ctest --preset ${{ matrix.preset }}-netinfo || true
      - name: Upload the macOS binary for the universal build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: curia-${{ matrix.name }}
          path: build/${{ matrix.preset }}/app/curia
          retention-days: 3
          if-no-files-found: error

  universal:
    name: macOS universal binary
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: curia-macos-*
          path: parts
      - name: Merge with lipo
        run: |
          lipo -create -output curia-universal parts/curia-macos-arm64/curia parts/curia-macos-x64/curia
          lipo -archs curia-universal
          test "$(lipo -archs curia-universal | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          chmod +x curia-universal
      - name: Run both slices (Rosetta is part of the runner image)
        run: |
          arch -arm64 ./curia-universal --version
          arch -x86_64 ./curia-universal --version
          arch -x86_64 ./curia-universal --smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: curia-macos-universal-unsigned
          path: curia-universal
          retention-days: 3

  sanitizers:
    name: sanitizers and clang-tidy (core + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-key-suffix: curia-x64-linux-core
      - name: Configure (core and tests only, ASan and UBSan)
        run: cmake --preset linux-x64-sanitize -DCURIA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-x64-sanitize
      - name: Save the vcpkg binary cache (even if a later step failed)
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset linux-x64-sanitize
      - name: clang-tidy (core, net, Linux platform, tests)
        run: |
          # The macOS-only probe tests (test_probe_*) are not part of this configuration.
          find app/src/core app/src/net app/src/platform/linux app/tests -name '*.cpp' -not -name 'test_probe_*' -print0 |
            xargs -0 -n1 clang-tidy-18 -p build/linux-x64-sanitize --quiet

  dependency-review:
    name: dependency review (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-result:
    name: CI result
    if: always()
    needs: [lint, build, universal, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success")) | length == 0' > /dev/null
