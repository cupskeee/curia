name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message on main and must follow
# Conventional Commits. This is its own workflow (and its own required check, "PR title") because the
# check has to re-run when only the title is edited, which the main CI should not.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
