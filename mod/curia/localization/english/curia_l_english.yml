l_english:

 # Buttons
 curia_button_advisor: "Advisor"
 curia_button_advisor_tt: "Curia: write a snapshot of your realm to the game log for the Curia app. Read-only; nothing in your game changes."
 curia_button_probes: "Curia probes"
 curia_button_probes_tt: "Curia spike, for testing only: write the snapshot plus extra probe lines to the game log. Read-only; nothing in your game changes."

 # Frame lines (CURIA1 wire format, docs/architecture.md section 4)
 curia_line_begin: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|BEGIN|[GetCurrentDate.GetString]|[THIS.GetCharacter.GetNameNoTooltip]|[THIS.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip]|[EmptyScope.ScriptValue('curia_probe_mode_value')|0]"
 curia_line_fin: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|FIN|[THIS.GetCharacter.GetGold|0]"
 curia_line_heir: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|HEIR|[THIS.GetCharacter.GetNameNoTooltip]|[THIS.ScriptValue('curia_opinion_of_liege_guarded')|0]|[THIS.ScriptValue('curia_has_liege_value')|0]|[THIS.ScriptValue('curia_is_landed_value')|0]"
 curia_line_heir_none: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|HEIR|none"
 curia_line_vassal: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|VASSAL|[EmptyScope.ScriptValue('curia_rank_value')|0]|[THIS.GetCharacter.GetNameNoTooltip]|[THIS.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip]|[THIS.GetCharacter.GetGold|0]|[THIS.ScriptValue('curia_opinion_of_liege')|0]"
 curia_line_vassal_none: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|VASSAL|0|none"
 curia_line_war_name: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|WAR|[EmptyScope.ScriptValue('curia_war_index_value')|0]|NAME|[THIS.War.GetName]"
 curia_line_war_attacker: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|WAR|[EmptyScope.ScriptValue('curia_war_index_value')|0]|ATTACKER|[THIS.GetCharacter.GetNameNoTooltip]"
 curia_line_war_defender: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|WAR|[EmptyScope.ScriptValue('curia_war_index_value')|0]|DEFENDER|[THIS.GetCharacter.GetNameNoTooltip]"
 curia_line_war_none: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|WAR|0|none"
 curia_line_claim: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|CLAIM|[EmptyScope.ScriptValue('curia_claim_index_value')|0]|[THIS.Title.GetNameNoTierNoTooltip]"
 curia_line_claim_none: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|CLAIM|0|none"
 curia_line_end: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|END|[EmptyScope.ScriptValue('curia_line_count_value')|0]"

 # Probe lines (candidates, not proven): the form under test is the expression after the second pipe pair
 curia_probe_snap_id_this: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|snap_id_this|[THIS.ScriptValue('curia_snap_id_value')|0]"
 curia_probe_ruler_id: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|ruler_id|[THIS.GetCharacter.GetID]"
 curia_probe_ruler_first_name: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|ruler_first_name|[THIS.GetCharacter.GetFirstNameNoTooltip]"
