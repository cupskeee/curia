 curia_probe_heir_none: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|heir|none"
 curia_probe_vassal_id: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|vassal_id|[THIS.GetCharacter.GetID]"
 curia_probe_vassal_first_name: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|vassal_first_name|[THIS.GetCharacter.GetFirstNameNoTooltip]"
 curia_probe_vassal_landed: "CURIA1|[EmptyScope.ScriptValue('curia_snap_id_value')|0]|PROBE|vassal_landed|[THIS.ScriptValue('curia_is_landed_value')|0]"
